name: Generate Profile Badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0,1' # Runs daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-IDbadge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run SVG generator script
        env:
          GH_TOKEN: ${{ secrets.ACT_TOKEN }} # Passes GitHub's token securely to Python
          GH_USERNAME: FORESTND
        run: python generate_badge.py

      - name: Commit and push if badge changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile badge & stats" && git push)

  delete-old-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: 2.65.0 # optional, see action.yml for current default

      - name: Authenticate GitHub CLI
        run: echo ${{ secrets.GITHUB_TOKEN }} | gh auth login --with-token

      - name: Delete old workflow runs
        env:
          REPO: ${{ github.repository }}
          RETENTION_DAYS: 3
        run: |
          # Get the current date in seconds since epoch
          current_date=$(date +%s)
          # Get all workflow runs
          echo "Purging all actions older than $RETENTION_DAYS days date $(date)" > deleted_runs.log
          runs=$(gh api "repos/${REPO}/actions/runs" --paginate -q '.workflow_runs[] | select(.event != "workflow_dispatch") | [.name, .id, .created_at]')
          echo "$runs" | jq -r '. | @tsv' | while IFS=$'\t' read -r run_name id created_at
          do
              created_at_seconds=$(date -d "$created_at" +%s)
              age=$(( (current_date - created_at_seconds) / 86400 ))
              if [ "$age" -gt "$RETENTION_DAYS" ]; then
                  echo "Deleting run $run_name ($id, $created_at, $age days old)"
                  gh api "repos/${REPO}/actions/runs/$id" -X DELETE
                  echo "- Run $run_name ($id), Created At: $created_at, Age: $age days" >> deleted_runs.log
              fi
          done
          cat deleted_runs.log >> $GITHUB_STEP_SUMMARY