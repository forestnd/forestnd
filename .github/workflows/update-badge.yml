name: Generate Profile Badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run SVG generator script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Passes GitHub's token securely to Python
        run: python generate_badge.py

      - name: Commit and push if badge changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add badge.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update profile badge & stats" && git push)
