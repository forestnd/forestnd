<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Styles & Keyframe Animations -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-0.5deg); }
        50% { transform: rotate(0.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { stroke: #10B981; filter: drop-shadow(0 0 2px #10B981); }
        50% { stroke: #06B6D4; filter: drop-shadow(0 0 8px #06B6D4); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(170px); opacity: 0; }
      }

      .animated-badge {
        transform-origin: top center;
        animation: float 4s ease-in-out infinite;
      }
      .animated-strap {
        transform-origin: top center;
        animation: sway 5s ease-in-out infinite;
      }
      .glowing-border {
        animation: pulseGlow 3s infinite ease-in-out;
      }
      .scan-line {
        animation: scan 3s linear infinite;
      }
    </style>

    <!-- Drop Shadow Filters -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Lanyard Strap Gradient -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>

    <!-- Metallic Buckle Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="50%" stop-color="#11111B" />
      <stop offset="100%" stop-color="#0B0B10" />
    </linearGradient>

    <!-- Stats Card Background Gradient -->
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A24" />
      <stop offset="100%" stop-color="#11131C" />
    </linearGradient>

    <!-- Photo Slot Clip Path (Rounded Square) -->
    <clipPath id="avatarClip">
      <rect x="250" y="140" width="180" height="180" rx="16" />
    </clipPath>
  </defs>

  <!-- 1. SWAYING LANYARD STRAP -->
  <g class="animated-strap">
    <rect x="326" y="0" width="28" height="74" rx="3" fill="url(#strapGrad)" />
  </g>

  <!-- 2. FLOATING BADGE ASSEMBLY -->
  <g class="animated-badge">
    <!-- Metal Clip & Loop -->
    <g filter="url(#card-shadow)">
      <rect x="320" y="65" width="40" height="12" rx="3" fill="url(#metalGrad)" />
      <circle cx="340" cy="85" r="8" fill="none" stroke="url(#metalGrad)" stroke-width="4" />
    </g>

    <!-- Main Badge Shell -->
    <g filter="url(#card-shadow)">
      <!-- Outer Card Body -->
      <rect x="210" y="90" width="260" height="402" rx="22" fill="url(#cardGrad)" stroke="#1F2937" stroke-width="2" />

      <!-- Glowing Accent Border -->
      <rect class="glowing-border" x="211" y="91" width="258" height="400" rx="21" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.9" />

      <!-- Photo Frame / GitHub Avatar Container -->
      <g>
        <!-- Background Placeholder for Photo Slot -->
        <rect x="250" y="140" width="180" height="180" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="2" />

        <!-- Auto-fetches your GitHub Profile Picture -->
        <image x="250" y="140" width="180" height="180" href="{{BASE64_LOGO}}" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />

        <!-- Animated Holographic Laser Scan Line -->
        <g clip-path="url(#avatarClip)">
          <line class="scan-line" x1="250" y1="140" x2="430" y2="140" stroke="#06B6D4" stroke-width="3" opacity="0.8" />
        </g>
      </g>

      <!-- Profile Username & Titles -->
      <text x="340" y="355" font-family="sans-serif" font-weight="800" font-size="22" fill="#F9FAFB" text-anchor="middle" letter-spacing="1">
        @{{VAL_USERNAME}}
      </text>

      <text x="340" y="375" font-family="sans-serif" font-weight="500" font-size="11" fill="#10B981" text-anchor="middle" letter-spacing="0.5">
        • Joined: {{VAL_USER_JOINED}}
      </text>

      <text x="340" y="396" font-family="sans-serif" font-weight="500" font-size="11" fill="#10B981" text-anchor="middle" letter-spacing="0.5">
        • HOBBIE CODER
      </text>

      <!-- Decorative Divider Line -->
      <line x1="240" y1="405" x2="440" y2="405" stroke="#374151" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Faux Barcode Section -->
      <g>
      <image x="230" y="390" width="200" height="90" href="{{BASE64_FOOTER}}"  />
      </g>
    </g>
  </g>

  <!-- 3. STATS CARDS BELOW THE BADGE -->
  <g transform="translate(15, 515)" filter="url(#card-shadow)">
    <!-- CARD 1: REPOS -->
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="205" height="120" rx="16" fill="url(#statBg)" stroke="#26293B" stroke-width="1.5" />
      <!-- Folder Icon -->
      <path d="M18 20H8C6.9 20 6 19.1 6 18V8C6 6.9 6.9 6 8 6H12L14 8H18C19.1 8 20 8.9 20 10V18C20 19.1 19.1 20 18 20Z" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 15)"/>
      <text x="185" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end" letter-spacing="1">REPOS</text>
      <text x="25" y="75" font-family="sans-serif" font-size="30" font-weight="800" fill="#F9FAFB">{{VAL_REPOS}}</text>
      <text x="25" y="90" font-family="sans-serif" font-size="10" font-weight="800" fill="#F9FAFB">Public: {{VAL_REPOS_PUBLIC}}</text>
      <text x="85" y="90" font-family="sans-serif" font-size="10" font-weight="800" fill="#F9FAFB">Private: {{VAL_REPOS_PRIVATE}}</text>
    </g>

    <!-- CARD 3: COMMITS -->
    <g transform="translate(344, 0)">
      <rect x="0" y="0" width="205" height="120" rx="16" fill="url(#statBg)" stroke="#26293B" stroke-width="1.5" />
      <!-- Lightning Bolt Icon -->
      <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 13) scale(0.9)"/>
      <text x="185" y="32" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end" letter-spacing="1">CONTRIBUTIONS</text>
      <text x="25" y="75" font-family="sans-serif" font-size="30" font-weight="800" fill="#F9FAFB">{{VAL_COMMITS}}</text>
      <text x="25" y="100" font-family="sans-serif" font-size="13" font-weight="500" fill="#9CA3AF">This Year</text>
    </g>
  </g>
</svg>
